<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoWise AI - Giáo sư Sống Xanh</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2D6A4F;
            --primary-light: #40916C;
            --primary-dark: #1B4D3E;
            --secondary: #52B788;
            --accent: #95D5B2;
            --background: #F8F9FA;
            --text: #2D3E3F;
            --error: #D62828;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 20px 30px;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .api-status {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 12px;
            margin-top: 8px;
        }

        .api-status.connected {
            background: rgba(46, 204, 113, 0.3);
        }

        .api-status.disconnected {
            background: rgba(231, 76, 60, 0.3);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #F8F9FA;
        }

        .message {
            margin: 20px 0;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            justify-content: flex-end;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            line-height: 1.6;
        }

        .user-message .message-content {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot-message .message-content {
            background: white;
            color: var(--text);
            border-bottom-left-radius: 5px;
            border-left: 4px solid var(--primary);
        }

        .message-sender {
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        .message-time {
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.5;
            text-align: right;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
            background: white;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .input-area {
            padding: 20px 30px;
            background: white;
            border-top: 2px solid var(--accent);
            display: flex;
            gap: 15px;
        }

        .input-wrapper {
            flex: 1;
            background: var(--background);
            border-radius: 50px;
            padding: 5px 20px;
            display: flex;
            align-items: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: none;
            padding: 12px 0;
            outline: none;
            font-size: 15px;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover:not(:disabled) {
            transform: scale(1.1);
            background: var(--primary-dark);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .suggestions {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border-top: 1px solid var(--accent);
        }

        .suggestion-chip {
            background: white;
            border: 2px solid var(--accent);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            color: var(--primary-dark);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .suggestion-chip:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .error-message {
            background: #FFE5E5 !important;
            border-left: 4px solid var(--error) !important;
        }

        .fallback-note {
            font-size: 12px;
            color: #d68b00;
            font-style: italic;
            margin-top: 8px;
            display: block;
        }

        @media (max-width: 768px) {
            .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <p>Tư vấn mọi vấn đề về môi trường & phát triển bền vững</p>
            <div class="api-status" id="apiStatus">Đang kiểm tra kết nối...</div>
        </div>

        <div id="chatBox" class="chat-box"></div>

        <div class="suggestions" id="suggestions">
            <div class="suggestion-chip" onclick="chatBot.useSuggestion('Làm thế nào để bắt đầu sống xanh?')">🌱 Bắt đầu sống xanh</div>
            <div class="suggestion-chip" onclick="chatBot.useSuggestion('Cách tiết kiệm điện hiệu quả trong gia đình?')">⚡ Tiết kiệm điện</div>
            <div class="suggestion-chip" onclick="chatBot.useSuggestion('Phân loại rác thải như thế nào cho đúng?')">🗑️ Phân loại rác</div>
            <div class="suggestion-chip" onclick="chatBot.useSuggestion('Có nên lắp điện mặt trời không? Chi phí?')">☀️ Điện mặt trời</div>
            <div class="suggestion-chip" onclick="chatBot.useSuggestion('Ăn uống thế nào để bảo vệ môi trường?')">🥗 Ăn uống xanh</div>
            <div class="suggestion-chip" onclick="chatBot.useSuggestion('Cách giảm rác thải nhựa hàng ngày?')">🚯 Giảm rác nhựa</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <i class="fas fa-leaf" style="color: var(--primary);"></i>
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Hỏi bất cứ điều gì về sống xanh..."
                    maxlength="2000"
                >
            </div>
            <button class="action-btn" onclick="chatBot.send()" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // API Configuration
        const CONFIG = {
            API_URL: 'https://round-wave-244f.lenguyenngocthieu55.workers.dev/',
            TIMEOUT: 15000 // 15 seconds
        };

        // Enhanced local knowledge base
        const LOCAL_RESPONSES = {
            general: [
                `Chào bạn! Tôi có thể tư vấn cho bạn về nhiều khía cạnh của sống xanh:
                
• 🌱 **Lối sống xanh**: Tiết kiệm năng lượng, giảm rác thải, tái chế
• 💧 **Bảo vệ môi trường**: Tiết kiệm nước, bảo vệ không khí, trồng cây
• 🏡 **Gia đình bền vững**: Nhà ở xanh, thực phẩm sạch, tiêu dùng thông minh
• ♻️ **Kinh tế tuần hoàn**: Tái sử dụng, sửa chữa, chia sẻ
• 🌍 **Biến đổi khí hậu**: Nguyên nhân, tác động, giải pháp

Bạn quan tâm đến vấn đề gì nhất?`,

                `Tôi là chuyên gia về sống xanh và phát triển bền vững. 
                
Bạn có thể hỏi tôi về:
✅ Các giải pháp tiết kiệm năng lượng cho gia đình
✅ Cách phân loại và tái chế rác thải hiệu quả
✅ Xu hướng sống xanh mới nhất
✅ Tác động của biến đổi khí hậu đến Việt Nam
✅ Kinh nghiệm trồng rau sạch tại nhà

Hãy cho tôi biết bạn muốn tìm hiểu điều gì?`
            ],
            energy: [
                `**Cách tiết kiệm điện hiệu quả trong gia đình:**

💡 **Chiếu sáng:**
- Thay đèn LED (tiết kiệm 80% điện)
- Tận dụng ánh sáng tự nhiên

❄️ **Điều hòa:**
- Đặt nhiệt độ 25-26°C (tiết kiệm 10% cho mỗi 1°C)
- Vệ sinh lưới lọc 2 tuần/lần

🧊 **Tủ lạnh:**
- Để cách tường 10cm
- Hạn chế mở tủ thường xuyên

Bạn đã áp dụng được cách nào chưa?`
            ],
            waste: [
                `**Hướng dẫn phân loại rác tại nhà (3 thùng):**

🗑️ **Thùng xanh - Rác hữu cơ:**
• Thức ăn thừa, rau củ quả hỏng
• Bã cà phê, trà, vỏ trứng

♻️ **Thùng vàng - Rác tái chế:**
• Giấy báo, bìa carton
• Chai nhựa (rửa sạch), lon nhôm

⚫ **Thùng đen - Rác còn lại:**
• Túi nilon bẩn, ống hút
• Cao su, mút xốp`
            ],
            water: [
                `**Cách tiết kiệm nước trong gia đình:**

🚿 **Phòng tắm:**
- Tắm nhanh 5 phút (tiết kiệm 150L/ngày)
- Khóa vòi khi đánh răng

🍳 **Nhà bếp:**
- Rửa rau trong chậu thay vòi chảy
- Dùng máy rửa chén khi đầy tải`
            ],
            food: [
                `**Ăn uống bền vững - Tốt cho sức khỏe, tốt cho hành tinh:**

🥗 **Nguyên tắc đĩa ăn xanh:**
- 50% rau củ quả (2-3 loại/ngày)
- 25% ngũ cốc nguyên hạt
- 25% đạm thực vật (đậu, nấm, hạt)

💡 **Mẹo:** "Meatless Monday" - Ăn chay 1 ngày/tuần giúp giảm 52kg CO2/năm!`
            ],
            garden: [
                `**Hướng dẫn làm vườn cho người ở phố:**

🌱 **Cây dễ trồng cho ban công:**
• Rau muống (20-25 ngày thu hoạch)
• Xà lách, Húng quế, Cà chua bi

🪴 **Dụng cụ cần:** Chậu có lỗ thoát nước, Đất trồng sạch, Phân hữu cơ.
💧 **Chăm sóc:** Tưới sáng sớm/chiều mát, bón phân 2 tuần/lần.`
            ],
            transport: [
                `**Di chuyển xanh - Lựa chọn thông minh:**

🚲 **Xe đạp:** 0 đồng/km, phù hợp quãng đường <5km
🛵 **Xe máy điện:** Rẻ hơn xăng 70%
🚌 **Xe buýt:** Giảm 70% khí thải so với xe máy
🚶 **Đi bộ:** Miễn phí, tốt cho sức khỏe`
            ],
            home: [
                `**Cách cải tạo nhà thành không gian xanh:**
1. 🌿 Trồng cây xanh trong nhà
2. 💡 Thay đèn LED
3. 🚿 Lắp vòi sen tiết kiệm nước
4. 🪟 Tận dụng ánh sáng tự nhiên
5. ♻️ Phân loại rác tại nguồn`
            ],
            climate: [
                `**Biến đổi khí hậu tại Việt Nam - Thực trạng và giải pháp:**

🌡️ **Tác động:** Nhiệt độ tăng, mực nước biển dâng, thiên tai gia tăng.
💚 **Hành động:** Giảm phát thải CO2, sử dụng năng lượng tái tạo, hạn chế rác thải nhựa, trồng và bảo vệ cây xanh.`
            ]
        };

        class EcoWiseBot {
            constructor() {
                this.chatBox = document.getElementById('chatBox');
                this.userInput = document.getElementById('userInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.apiStatus = document.getElementById('apiStatus');
                this.history = [];
                this.isLoading = false;
                this.apiAvailable = false;
                
                this.init();
                this.checkAPI();
            }

            async checkAPI() {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    
                    const response = await fetch(CONFIG.API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            message: 'ping',
                            test: true 
                        }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        this.apiAvailable = true;
                        this.apiStatus.textContent = '🟢 Kết nối AI thành công';
                        this.apiStatus.className = 'api-status connected';
                    } else {
                        throw new Error('API not responding');
                    }
                } catch (error) {
                    this.apiAvailable = false;
                    this.apiStatus.textContent = '🔴 Đang dùng kiến thức nội bộ (AI offline)';
                    this.apiStatus.className = 'api-status disconnected';
                    
                    this.addMessage(this.getLocalResponse('general'), 'bot');
                }
            }

            init() {
                this.userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !this.isLoading) {
                        this.send();
                    }
                });

                if (!this.apiAvailable) {
                    this.addMessage(this.getLocalResponse('general'), 'bot');
                }
            }

            useSuggestion(text) {
                this.userInput.value = text;
                this.send();
            }

            async send() {
                const message = this.userInput.value.trim();
                if (!message || this.isLoading) return;

                this.userInput.value = '';
                
                this.addMessage(message, 'user');
                this.history.push({ role: 'user', content: message });

                if (this.apiAvailable) {
                    await this.callAPI(message);
                } else {
                    setTimeout(() => {
                        const response = this.getSmartLocalResponse(message);
                        this.addMessage(response, 'bot');
                        this.history.push({ role: 'assistant', content: response });
                    }, 1000);
                    
                    this.showTyping();
                    setTimeout(() => this.removeTyping(), 800);
                }
            }

            async callAPI(message) {
                this.isLoading = true;
                this.sendBtn.disabled = true;
                this.showTyping();

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), CONFIG.TIMEOUT);

                try {
                    const response = await fetch(CONFIG.API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: message,
                            history: this.history.slice(-10)
                        }),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error('API error');

                    const data = await response.json();
                    
                    // --- ĐÂY LÀ PHẦN SỬA LỖI QUOTA ---
                    // Bắt các chuỗi lỗi trả về từ Google thông qua Worker
                    if (data.reply && (data.reply.includes('Quota exceeded') || data.reply.includes('429') || data.reply.includes('rate-limit'))) {
                        throw new Error('QUOTA_EXCEEDED');
                    }
                    
                    this.removeTyping();
                    this.addMessage(data.reply, 'bot');
                    this.history.push({ role: 'assistant', content: data.reply });

                } catch (error) {
                    clearTimeout(timeoutId);
                    this.removeTyping();
                    
                    // Xử lý thông báo Fallback mượt mà
                    let fallbackNote = '<span class="fallback-note">*Đang dùng kiến thức nội bộ do mạng chậm*</span>';
                    
                    if (error.message === 'QUOTA_EXCEEDED') {
                        fallbackNote = '<span class="fallback-note">*Hệ thống AI đang quá tải (vượt hạn mức miễn phí). Tạm thời tôi sẽ tư vấn bằng kiến thức nội bộ nhé!*</span>';
                    }
                    
                    const localResponse = this.getSmartLocalResponse(message);
                    
                    // Thêm fallbackNote vào sau câu trả lời nội bộ
                    this.addMessage(localResponse + fallbackNote, 'bot');
                    this.history.push({ role: 'assistant', content: localResponse });
                    
                    // Đổi trạng thái hiển thị
                    this.apiAvailable = false;
                    this.apiStatus.textContent = '🔴 Đang dùng kiến thức nội bộ (Quá tải)';
                    this.apiStatus.className = 'api-status disconnected';

                } finally {
                    this.isLoading = false;
                    this.sendBtn.disabled = false;
                    this.userInput.focus();
                }
            }

            getSmartLocalResponse(message) {
                const lowerMsg = message.toLowerCase();
                
                if (lowerMsg.includes('chào') || lowerMsg.includes('hello') || lowerMsg.includes('hi')) return this.getLocalResponse('general');
                if (lowerMsg.includes('cảm ơn') || lowerMsg.includes('thank')) return 'Cảm ơn bạn! Rất vui được giúp đỡ. Bạn còn thắc mắc gì về sống xanh không? 🌱';
                if (lowerMsg.includes('điện') || lowerMsg.includes('năng lượng') || lowerMsg.includes('mặt trời')) return this.getLocalResponse('energy');
                if (lowerMsg.includes('rác') || lowerMsg.includes('phân loại') || lowerMsg.includes('tái chế') || lowerMsg.includes('nhựa')) return this.getLocalResponse('waste');
                if (lowerMsg.includes('nước') || lowerMsg.includes('tiết kiệm')) return this.getLocalResponse('water');
                if (lowerMsg.includes('ăn') || lowerMsg.includes('thực phẩm') || lowerMsg.includes('chay')) return this.getLocalResponse('food');
                if (lowerMsg.includes('vườn') || lowerMsg.includes('trồng') || lowerMsg.includes('cây') || lowerMsg.includes('rau')) return this.getLocalResponse('garden');
                if (lowerMsg.includes('xe') || lowerMsg.includes('đi lại') || lowerMsg.includes('di chuyển')) return this.getLocalResponse('transport');
                if (lowerMsg.includes('nhà') || lowerMsg.includes('căn hộ')) return this.getLocalResponse('home');
                if (lowerMsg.includes('khí hậu') || lowerMsg.includes('nóng lên') || lowerMsg.includes('trái đất')) return this.getLocalResponse('climate');
                
                return this.getLocalResponse('general');
            }

            getLocalResponse(category) {
                const responses = LOCAL_RESPONSES[category] || LOCAL_RESPONSES.general;
                if (Array.isArray(responses)) {
                    return responses[Math.floor(Math.random() * responses.length)];
                }
                return responses;
            }

            addMessage(text, sender, isError = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                if (isError) contentDiv.classList.add('error-message');
                
                const senderDiv = document.createElement('div');
                senderDiv.className = 'message-sender';
                senderDiv.innerHTML = sender === 'user' ? 
                    '<i class="fas fa-user"></i> Bạn' : 
                    '<i class="fas fa-robot"></i> Giáo sư AI';
                
                const textDiv = document.createElement('div');
                textDiv.className = 'message-text';
                
                // Format text
                let formattedText = text
                    .replace(/\n/g, '<br>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>');
                
                // Tránh việc split <br><br> làm hỏng cấu trúc HTML của fallbackNote
                textDiv.innerHTML = formattedText; 
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = new Date().toLocaleTimeString('vi-VN', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                
                contentDiv.appendChild(senderDiv);
                contentDiv.appendChild(textDiv);
                contentDiv.appendChild(timeDiv);
                messageDiv.appendChild(contentDiv);
                
                this.chatBox.appendChild(messageDiv);
                this.scrollToBottom();
            }

            showTyping() {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'message bot-message';
                typingDiv.id = 'typingIndicator';
                
                const indicatorDiv = document.createElement('div');
                indicatorDiv.className = 'typing-indicator';
                indicatorDiv.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
                
                typingDiv.appendChild(indicatorDiv);
                this.chatBox.appendChild(typingDiv);
                this.scrollToBottom();
            }

            removeTyping() {
                const typing = document.getElementById('typingIndicator');
                if (typing) typing.remove();
            }

            scrollToBottom() {
                this.chatBox.scrollTop = this.chatBox.scrollHeight;
            }
        }

        const chatBot = new EcoWiseBot();
    </script>
</body>
</html>
